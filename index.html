<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semester: the price of a degree</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#16203d;--mute:#5d6a8c;--line:#d5dbea;--money:#0e9f6e;--bad:#d93a45;--acc:#3b4cca;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121933;--card:#1b2547;--ink:#eef1ff;--mute:#9aa6cf;--line:#2c3866;--money:#3ddc97;--bad:#ff6b73;--acc:#7e8cff;--accink:#10173a}}
:root[data-theme="dark"]{--bg:#121933;--card:#1b2547;--ink:#eef1ff;--mute:#9aa6cf;--line:#2c3866;--money:#3ddc97;--bad:#ff6b73;--acc:#7e8cff;--accink:#10173a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:56px 16px 16px}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:5;padding:6px 12px;font-size:14px}
h1,h2,.num{font-family:Unbounded,Manrope,system-ui,sans-serif}
h1{font-size:22px;margin:8px 0 4px}
h2{font-size:17px;margin:0 0 8px}
p{margin:0 0 10px}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.debt{font-size:34px;font-weight:700;color:var(--bad);line-height:1.1}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 120px;min-width:110px}
.stat b{display:block;font-size:20px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.pips{display:flex;gap:6px;margin:6px 0 12px}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--acc)}
.pip.on{background:var(--acc)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;text-align:left}
button:hover:not(:disabled){border-color:var(--acc)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:800;text-align:center}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.acts small{display:block;color:var(--mute)}
#log{max-height:150px;overflow:auto;font-size:14px}
#log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.opts{display:grid;gap:8px;margin-top:10px}
.quote{border-left:4px solid var(--acc);padding-left:12px;color:var(--mute);font-style:italic}
</style>
</head>
<body>
<button id="snd" onclick="toggleSnd()" aria-pressed="true">♪ Music: on</button>
<main id="app"></main>
<script>
const SEMS=8, AP=6;
let S;
const $=s=>document.querySelector(s);
const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let AC,master,musicOn=true,nextT=0,beat=0;
const hz=m=>440*Math.pow(2,(m-69)/12);
const CH=[[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,65]];
const PENT=[69,72,74,76,79,81];
function tone(t,m,dur,vol,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=hz(m);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function sched(){const spb=60/72;
 while(nextT<AC.currentTime+.6){
  const c=CH[Math.floor(beat/4)%4];
  if(beat%4===0){c.forEach(n=>tone(nextT,n,spb*3.8,.035,'sine'));tone(nextT,c[0]-12,spb*3.5,.09,'sine')}
  if(beat%4===2)tone(nextT,c[0]-12,spb*1.5,.06,'sine');
  if(Math.random()<.5)tone(nextT+(Math.random()<.3?spb/2:0),PENT[Math.floor(Math.random()*PENT.length)],spb*1.6,.03,'triangle');
  nextT+=spb;beat++;
 }}
function startAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain();master.gain.value=musicOn?.8:0;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;master.connect(f);f.connect(AC.destination);
 nextT=AC.currentTime+.1;setInterval(sched,200)}
function toggleSnd(){musicOn=!musicOn;startAudio();if(AC.state==='suspended')AC.resume();
 master.gain.value=musicOn?.8:0;const b=$('#snd');b.textContent='♪ Music: '+(musicOn?'on':'off');b.setAttribute('aria-pressed',musicOn)}
function sfx(k){if(!AC||!musicOn)return;const t=AC.currentTime;
 if(k==='coin'){tone(t,84,.18,.07,'square');tone(t+.08,88,.25,.07,'square')}
 if(k==='pay'){tone(t,67,.2,.08,'triangle');tone(t+.12,60,.35,.08,'triangle')}
 if(k==='debt'){tone(t,48,.6,.09,'sawtooth');tone(t+.1,47,.6,.07,'sawtooth')}
 if(k==='click')tone(t,76,.08,.05,'triangle')}
document.addEventListener('pointerdown',e=>{if(e.target.id!=='snd'&&!AC)startAudio()});


function init(){
  S={sem:1,ap:AP,money:1500,debt:0,energy:5,grades:70,job:10,schol:4000,tmult:1,wage:900,log:[],event:null,over:false,eventsUsed:[]};
  log('You are an international student from Bangladesh living in the Detroit area. Your parents can\'t help, so it is all on you. Goal: reach graduation and find a job.');
  startSem();
}
const tuition=()=>9000*Math.pow(1.07,S.sem-1)*S.tmult;
const due=()=>Math.max(0,tuition()-S.schol);
function log(t){S.log.unshift(t);S.log=S.log.slice(0,30)}

const EVENTS=[
 {t:'The university raises tuition',d:'Schools run like businesses now. Next semester costs 8% more.',o:[
  {l:'Accept it',f:()=>{S.tmult*=1.08;return 'Tuition went up. It never seems to come down.'}},
  {l:'Fight for a grant (−1 AP, 50% chance)',f:()=>{S.ap=Math.max(0,S.ap-1);if(Math.random()<.5){S.schol+=1200;return 'Grant approved: +'+fmt(1200)+' scholarship.'}S.tmult*=1.08;return 'Grant denied, and tuition went up.'}}]},
 {t:'The economy slows down',d:'Employers are hiring less and campus jobs pay less. The future looks uncertain.',o:[
  {l:'Face reality (wages −15%)',f:()=>{S.wage*=.85;return 'A shift now pays '+fmt(S.wage)+'.'}}]},
 {t:'Job fair on campus',d:'Employers have come to campus. A chance to connect your studies with a job.',o:[
  {l:'Go (−1 energy)',f:()=>{S.energy=Math.max(0,S.energy-1);S.job+=9;return 'You handed out résumés and made contacts. Job chances +9.'}},
  {l:'Skip it',f:()=>'You stayed in and caught up on notes.'}]},
 {t:'Scholarship review',d:'The committee checks your grades. You need at least 65.',o:[
  {l:'See the decision',f:()=>{if(S.grades>=65)return 'Your scholarship is safe. For now.';S.schol=Math.max(0,S.schol-1500);return 'Grades too low: your scholarship was cut by '+fmt(1500)+'.'}}]},
 {t:'A second campus job',d:'The campus café offers extra shifts. You need the money, but you are short on energy.',o:[
  {l:'Take it (+$1,200, −2 energy, grades −5)',f:()=>{S.money+=1200;S.energy=Math.max(0,S.energy-2);S.grades-=5;return 'The money arrived, and so did the exhaustion.'}},
  {l:'Decline',f:()=>'You saved your strength.'}]},
 {t:'Career program',d:'Your department launched a program that connects students directly with employers. Exactly what was missing.',o:[
  {l:'Sign up (−1 AP)',f:()=>{S.ap=Math.max(0,S.ap-1);S.job+=14;return 'Education started working for your job search: +14.'}}]},
 {t:'Unexpected bill',d:'Your laptop broke, and you can\'t submit assignments without it.',o:[
  {l:'Buy a new one (−$700)',f:()=>{S.money-=700;return 'New laptop bought. Your balance took the hit.'}},
  {l:'Repair the old one (−$250, grades −4)',f:()=>{S.money-=250;S.grades-=4;return 'Cheap, but you lost study time.'}}]}
];

function startSem(){
  S.ap=AP; S.energy=Math.min(5,S.energy+3);
  if(S.sem>1){
    const pool=EVENTS.filter((_,i)=>!S.eventsUsed.includes(i));
    const e=pool[Math.floor(Math.random()*pool.length)];
    S.eventsUsed.push(EVENTS.indexOf(e)); if(S.eventsUsed.length>=EVENTS.length)S.eventsUsed=[];
    S.event=e;
  }
  render();
}
function pickOpt(i){sfx('click');
  const m=S.event.o[i].f(); log(m); S.event=null; render();
}
const ACTS=[
 {n:'Work a campus shift',d:()=>'+'+fmt(S.wage)+' · −1 energy',ap:1,en:1,f:()=>{S.money+=S.wage;S.grades-=1;sfx('coin');log('Worked a shift: +'+fmt(S.wage)+'.')}},
 {n:'Study',d:()=>'Grades +7 · −1 energy',ap:1,en:1,f:()=>{S.grades+=7;log('Spent the evening with your textbooks.')}},
 {n:'Internship and networking',d:()=>'Job chances +10 · 2 AP',ap:2,en:1,f:()=>{S.job+=10;log('Went to meetings with employers.')}},
 {n:'Apply for a scholarship',d:()=>'50%: +$1,000 scholarship',ap:1,en:1,f:()=>{if(Math.random()<.5){S.schol+=1000;log('Application approved: +'+fmt(1000)+'.')}else log('Application rejected.')}},
 {n:'Rest',d:()=>'+2 energy',ap:1,en:0,f:()=>{S.energy=Math.min(5,S.energy+2);log('Got some sleep.')}}
];
function act(i){
  const a=ACTS[i]; if(S.ap<a.ap||S.energy<a.en||S.event)return;
  S.ap-=a.ap; S.energy-=a.en; a.f(); render();
}
function endSem(){
  if(S.event)return;
  const d=due(), tui=Math.round(d);
  if(S.energy<=1){S.grades-=6;log('You are exhausted and your grades slipped.')}
  S.grades=clamp(S.grades-4,0,100);
  S.job=clamp(S.job,0,100);
  if(S.grades<50&&S.schol>0){S.schol=Math.max(0,S.schol-2000);log('Grades below 50: your scholarship was cut by '+fmt(2000)+'.')}
  if(S.money>=tui){S.money-=tui;sfx('pay');log('Semester '+S.sem+': paid tuition of '+fmt(tui)+'.')}
  else{const gap=tui-S.money;S.debt+=gap;S.money=0;sfx('debt');log('Semester '+S.sem+': you were '+fmt(gap)+' short, and it went to debt.')}
  S.debt*=1.04;
  if(S.sem>=SEMS){S.over=true;render();return}
  S.sem++; startSem();
}
function ending(){
  const hired=S.job>=55&&S.grades>=60;
  const score=Math.round(S.job*.5+S.grades*.4-S.debt/1500);
  let t,d;
  if(hired&&S.debt<8000){t='Degree and a job';d='You survived the rising costs and landed a job. That is a rare result when you carry everything alone.'}
  else if(hired){t='Degree and debt';d='You got a job, but the first years will go to paying off '+fmt(S.debt)+'.'}
  else if(S.grades>=60){t='Degree, no job';d='You finished school, but you lacked connections with employers. The question "will I find a job?" is still open.'}
  else{t='Degree in doubt';d='Low grades and debt. You may have to go back to school and borrow more.'}
  return {t,d,score};
}
function bar(v){return '<div class="bar"><i style="width:'+clamp(v,0,100)+'%"></i></div>'}
function render(){
  const a=$('#app');
  if(S.over){
    const e=ending();
    a.innerHTML='<h1>'+e.t+'</h1><div class="card"><p>'+e.d+'</p>'+
    '<div class="row"><div class="stat"><span class="mute">Debt</span><b class="num">'+fmt(S.debt)+'</b></div>'+
    '<div class="stat"><span class="mute">Grades</span><b class="num">'+Math.round(S.grades)+'</b></div>'+
    '<div class="stat"><span class="mute">Job chances</span><b class="num">'+Math.round(S.job)+'</b></div>'+
    '<div class="stat"><span class="mute">Score</span><b class="num">'+e.score+'</b></div></div></div>'+
    '<div class="card"><p class="quote">To have education go hand-in-hand with finding a job.</p>'+
    '<p class="mute">That is what the student in the interview behind this game wants to see. In the game, networking and the career program helped. In real life, not everyone gets them.</p></div>'+
    '<button class="main" style="width:100%" onclick="init()">Play again</button>';
    return;
  }
  const d=due();
  let h='<h1>Semester '+S.sem+' of '+SEMS+'</h1>'+
  '<p class="mute">Tuition before aid '+fmt(tuition())+' · scholarship '+fmt(S.schol)+' · due at the end of the semester</p>'+
  '<div class="card"><span class="mute">Due this semester</span><div class="debt num">'+fmt(d)+'</div>'+
  '<p class="mute" style="margin:6px 0 0">You have '+fmt(S.money)+(S.debt>0?' · debt <b style="color:var(--bad)">'+fmt(S.debt)+'</b>':'')+'</p></div>'+
  '<div class="card row">'+
  '<div class="stat"><span class="mute">Money</span><b class="num" style="color:var(--money)">'+fmt(S.money)+'</b></div>'+
  '<div class="stat"><span class="mute">Energy</span><b class="num">'+S.energy+'/5</b>'+bar(S.energy*20)+'</div>'+
  '<div class="stat"><span class="mute">Grades</span><b class="num">'+Math.round(S.grades)+'</b>'+bar(S.grades)+'</div>'+
  '<div class="stat"><span class="mute">Job chances</span><b class="num">'+Math.round(S.job)+'</b>'+bar(S.job)+'</div></div>';
  if(S.event){
    h+='<div class="card" role="dialog" aria-label="Event"><h2>'+S.event.t+'</h2><p>'+S.event.d+'</p><div class="opts">'+
    S.event.o.map((o,i)=>'<button onclick="pickOpt('+i+')">'+o.l+'</button>').join('')+'</div></div>';
  }else{
    h+='<div class="card"><h2>Your time this semester</h2><div class="pips" aria-label="Action points left: '+S.ap+'">'+
    Array.from({length:AP},(_,i)=>'<span class="pip'+(i<S.ap?' on':'')+'"></span>').join('')+'</div><div class="acts">'+
    ACTS.map((x,i)=>'<button onclick="act('+i+')"'+((S.ap<x.ap||S.energy<x.en)?' disabled':'')+'>'+x.n+'<small>'+x.d()+'</small></button>').join('')+
    '</div><button class="main" style="width:100%" onclick="endSem()">End semester and pay tuition</button></div>';
  }
  h+='<div class="card"><h2>Log</h2><div id="log">'+S.log.map(l=>'<div>'+l+'</div>').join('')+'</div></div>';
  a.innerHTML=h;
}
init();
</script>
</body>
</html>
